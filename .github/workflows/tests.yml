name: Tests

on:
  pull_request:
  push:
    branches: [main, 'codex/group-stars-subscriptions']

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: guildhero_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s billing_tests -v
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/guildhero_test
      - run: npm run check:sui
      - run: npm run test:sui
